name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Offline smoke test (real Python engine, no GUI input)
        env:
          VISTA_PYTHON: python
        run: node tests/smoke.mjs
